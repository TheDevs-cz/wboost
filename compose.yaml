volumes:
    postgres-data:
    redis-data:
    mailpit-data:
    caddy_data:
    caddy_config:

services:
    web:
        image: ghcr.io/thedevs-cz/php:8.5-wboost
        restart: unless-stopped
        tty: true
        volumes:
            - .:/app
            - .docker/on-startup.sh:/docker-entrypoint.d/on-startup.sh
            - ./.docker/on-startup.sh:/docker-entrypoint.d/on-startup.sh
            - ./.docker/php/wboost.ini:/usr/local/etc/php/conf.d/zz-wboost.ini:ro
            - caddy_data:/data
            - caddy_config:/config
        depends_on:
            - postgres
            - redis
            - minio
        ports:
            - "${WEB_PORT:-8080}:80"
        # `scan`: the network the AI scanner calls the app on — its subnet is
        # what SCAN_NETWORK_CIDR (.env.dev) lets through to /internal/scanner/*.
        networks:
            - default
            - scan
        environment:
            # FRANKENPHP_WORKER: "1"
            # FRANKENPHP_WATCH: "1"
            XDEBUG_CONFIG: "client_host=host.docker.internal"
            XDEBUG_MODE: debug
            PHP_IDE_CONFIG: "serverName=localhost"

    landing:
        image: nginx:alpine
        restart: unless-stopped
        volumes:
            - ./landing/src:/usr/share/nginx/html:ro
            - ./landing/nginx.conf:/etc/nginx/conf.d/default.conf:ro
        ports:
            - "${LANDING_PORT:-8090}:80"

    postgres:
        image: postgres:16.1
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
            POSTGRES_DB: wboost
        volumes:
            - postgres-data:/var/lib/postgresql/data
        ports:
            - "${POSTGRES_PORT:-5432}:5432"

    redis:
        image: redis:7.2
        restart: unless-stopped
        volumes:
            - redis-data:/data

    adminer:
        image: adminer:5.3.0
        ports:
            - "${ADMINER_PORT:-8000}:8080"
        environment:
            ADMINER_DEFAULT_SERVER: postgres
        depends_on:
            - postgres

    mailer:
        image: axllent/mailpit
        ports:
            - "${MAILER_SMTP_PORT:-1025}:1025"
            - "${MAILER_WEB_PORT:-8025}:8025"
        environment:
            MP_SMTP_AUTH_ACCEPT_ANY: 1
            MP_SMTP_AUTH_ALLOW_INSECURE: 1
            MP_DATABASE: "/data/mailpit.db"
        volumes:
            - mailpit-data:/data

    minio:
        restart: unless-stopped
        image: minio/minio:latest
        environment:
            MINIO_DOMAIN: "localhost:19000"
            MINIO_SERVER_URL: "http://minio:9000"
            MINIO_BROWSER_REDIRECT_URL: "http://localhost:19001"
            MINIO_ROOT_USER: "wboost"
            MINIO_ROOT_PASSWORD: "wboostminio"
        command: ["server", "/data", "--console-address", ":9001"]
        ports:
            - "${MINIO_API_PORT:-19000}:9000"
            - "${MINIO_CONSOLE_PORT:-19001}:9001"
        volumes:
            - .docker-data/minio-data:/data
        healthcheck:
            test: "mc ready local"
            start_period: 5s
            timeout: 5s
            interval: 10s
            retries: 2

    # The headless renderer, as production runs it: the same build (digest pin —
    # the restriction flags below are multi-value only from 8.3x on) and the same
    # restriction, so a render that starts loading something by URL fails HERE,
    # not on production (docs/architecture/templates-render.md, "Renderer
    # isolation"; tests/Services/Editor/RendererIsolationGotenbergTest.php).
    # `$$` is compose's escape for a literal `$`.
    gotenberg:
        image: gotenberg/gotenberg:8.34.0@sha256:67097317623a503ba2a6a7e9ae8db6929a1f7e1bbd88077bacf2d325fbdab923
        command:
            - gotenberg
            - --chromium-auto-start
            # file: — only the conversion's own files, /tmp/<request>/<conversion>/<file>
            - '--chromium-deny-list=^file:(?!///tmp/[0-9a-f-]{36}/[0-9a-f-]{36}/[^/]+$$).*'
            # network — nothing, except the public picture host (a canvas picture
            # that could not be read from storage keeps its public URL)
            - '--chromium-deny-list=^(?!https://img\.wboost\.cz(:443)?(/|$$))(https?|wss?|ftp):'
            # …and whatever the list lets through must not resolve to a private address
            - --chromium-deny-private-ips

    minio_setup:
        image: minio/mc:latest
        restart: no
        depends_on:
            minio:
                condition: service_healthy
        volumes:
            - .docker/setup-minio.sh:/setup-minio.sh
        environment:
            MINIO_SERVER_URL: "http://minio:9000"
            MINIO_ACCESS_KEY: "wboost"
            MINIO_SECRET_KEY: "wboostminio"
            BUCKET_NAME: "wboost"
            # AI scan files: a second bucket WITHOUT an anonymous policy.
            PRIVATE_BUCKET_NAME: "wboost-private"
        entrypoint: ["sh", "/setup-minio.sh"]

networks:
    # AI scan (docs/architecture/ai-scan.md § "Scanner API"): `web` and the
    # scanner container share this network and nothing else does. A fixed
    # subnet, because the app accepts scanner calls only from it.
    scan:
        ipam:
            config:
                - subnet: 172.31.250.0/24
