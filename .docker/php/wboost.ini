; App-level PHP settings on top of the base image's 99-app.ini — loaded as
; conf.d/zz-wboost.ini in EVERY environment (Dockerfile COPY for prod,
; compose volume mounts for dev + the prod mirror).
;
; max_input_vars: the multi-page document fill page posts every page's
; fields in ONE form (text + hide + font mirrors, image picks, per-page
; placements). A 30-page document of realistic templates passes PHP's
; default 1000, and PHP enforces the limit by SILENTLY dropping the excess
; fields — the export would render default values with no error.
; TemplateDocumentFillControllerTest pins this value against a 30-page form.
; See docs/architecture/templates-documents.md ("Fill page").
max_input_vars = 10000

; post_max_size: the ceiling for a WHOLE request body. The biggest legitimate
; one is the manual mockup page form (ManualMockupPageFormType): 6 slot
; images x 10 MB + 6 per-image downloads x 20 MB + a 20 MB page download =
; 200 MB in ONE POST. PHP reads `M` as BINARY (256M = 268 435 456 bytes),
; so this leaves headroom for the other fields and the multipart framing.
; Past this limit PHP SILENTLY drops ALL of $_POST and $_FILES — the user
; would see "Invalid CSRF token" or a blank re-rendered form. The app turns
; that into an honest 413 (Services/Http/RejectOversizedRequestBodyListener)
; and RequestBodyLimit::POST_MAX_SIZE_BYTES mirrors this value for the
; client-side guard; RequestBodyLimitTest pins the two together.
; The edge (Traefik, lily.srv apps/wboost) buffers request bodies with its
; own cap, which must stay >= this one.
; See docs/architecture/gallery-and-uploads.md ("Request size limits").
post_max_size = 256M

; upload_max_filesize: PHP's per-FILE ceiling, kept generous on purpose. The
; real per-file caps (10 MB decimal images, 20 MB decimal mockup downloads)
; are the Symfony File/Image constraints, which answer with a proper form
; error; a file PHP rejects here only surfaces as an UPLOAD_ERR_INI_SIZE.
upload_max_filesize = 50M

; max_file_uploads: files per request. The mockup page form carries up to
; 13 (6 images + 6 per-image downloads + 1 page download); PHP silently
; drops files past the limit.
max_file_uploads = 20

; max_input_time: how long reading the request INPUT may take. Under
; FrankenPHP (worker mode, ≤ 1.13.5 at least) a multipart/form-data body is
; read AFTER the per-request timer is armed — with `max_input_time = -1` (the
; base image) that timer is max_execution_time (30 s), so an editor save or an
; upload trickling in over a slow uplink for > 30 s killed the request with
; "Maximum execution time of 30 seconds exceeded" at FrankenPhpWorkerRunner.php
; line 51, before any app code ran (Sentry WEB-4X, 2026-11-15). With a value
; set, FrankenPHP arms THIS limit for the input phase and resets the timer to
; max_execution_time before the app starts. 300 s outlasts the edge's 180 s
; readTimeout, so the edge — not PHP — bounds a slow upload. Defense in depth:
; production's edge also buffers request bodies (lily.srv apps/wboost).
max_input_time = 300
