; App-level PHP settings on top of the base image's 99-app.ini — loaded as
; conf.d/zz-wboost.ini in EVERY environment (Dockerfile COPY for prod,
; compose volume mounts for dev + the prod mirror).
;
; max_input_vars: the multi-page document fill page posts every page's
; fields in ONE form (text + hide + font mirrors, image picks, per-page
; placements). A 30-page document of realistic templates passes PHP's
; default 1000, and PHP enforces the limit by SILENTLY dropping the excess
; fields — the export would render default values with no error.
; TemplateDocumentFillControllerTest pins this value against a 30-page form.
; See docs/architecture/templates-documents.md ("Fill page").
max_input_vars = 10000
