framework:
    http_client:
        scoped_clients:
            # Meta Graph API (Facebook Pages + Instagram publishing). The base
            # URI carries the API version — bump it here in one place.
            meta.client:
                base_uri: '%env(META_GRAPH_BASE_URL)%'
                timeout: 20
            # Instagram API with Instagram Login (project Instagram publishing).
            # graph.instagram.com, versioned; the OAuth token endpoints are
            # called by absolute URL (InstagramApi).
            instagram.client:
                base_uri: '%env(INSTAGRAM_GRAPH_BASE_URL)%'
                timeout: 20
