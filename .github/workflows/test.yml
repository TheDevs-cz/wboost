name: Tests

on:
    push:
        branches:
            - main
    pull_request:

concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: false

env:
    DATABASE_URL: postgresql://postgres:postgres@postgres:5432/wboost_test?serverVersion=16&charset=utf8

jobs:
  tests:
    runs-on: ubuntu-latest
    container: ghcr.io/thedevs-cz/php:8.5-wboost

    services:
      postgres:
          image: postgres:16
          env:
              POSTGRES_PASSWORD: postgres
          options: --health-cmd pg_isready --health-interval 3s --health-timeout 3s --health-retries 5
          ports:
              - 5432:5432

    steps:
      -   uses: actions/checkout@v6

      -   uses: actions/cache@v5
          with:
              path: vendor
              key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
              restore-keys: |
                  ${{ runner.os }}-composer-

      -   uses: actions/cache@v5
          id: importmap-cache
          with:
              path: assets/vendor
              key: ${{ runner.os }}-importmap-${{ hashFiles('importmap.php') }}

      -   run: composer install --no-scripts --no-progress

      -   if: steps.importmap-cache.outputs.cache-hit != 'true'
          run: bin/console importmap:install

      -   run: bin/console asset-map:compile
      -   run: vendor/bin/phpunit


  # AI scan fault injection (tests/FaultInjection): REAL races between forked
  # processes, each with its own kernel and database connection, against a real
  # Postgres and outside DAMA's transaction — so it cannot share a run with the
  # suite above (it commits, and cleans up after itself). What it proves: one
  # transition and one ledger line whoever wins — claims, cancels, the reaper,
  # two starts, a replaced run's usage, accept × 2, accept vs discard / expiry,
  # fix vs accept, two tabs fixing. See docs/architecture/ai-scan.md § "Tests".
  fault-injection:
      runs-on: ubuntu-latest
      container: ghcr.io/thedevs-cz/php:8.5-wboost

      services:
          postgres:
              image: postgres:16
              env:
                  POSTGRES_PASSWORD: postgres
              options: --health-cmd pg_isready --health-interval 3s --health-timeout 3s --health-retries 5
              ports:
                  - 5432:5432

      steps:
          -   uses: actions/checkout@v6

          -   uses: actions/cache@v5
              with:
                  path: vendor
                  key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-composer-

          -   run: composer install --no-scripts --no-progress

          # Without pcntl the suite would skip itself and the job would be green for nothing.
          -   name: pcntl is there
              run: php -r 'exit(function_exists("pcntl_fork") && function_exists("posix_kill") ? 0 : 1);'

          -   run: vendor/bin/phpunit --group fault-injection


  # A released skill is immutable: once `wboost-plugin-v<version>` is tagged
  # (plugin-release.yml), any change under plugin/wboost or the marketplace
  # manifest needs a version bump — otherwise users with that version would
  # never receive it (Claude Code keys plugin updates on the version string).
  # The MCP tool ↔ skill comparison itself is tests/Mcp/SkillManifestTest.php.
  # See docs/mcp/skill-maintenance.md.
  skill-release-guard:
      runs-on: ubuntu-latest
      steps:
        -   uses: actions/checkout@v6
            with:
                fetch-depth: 0
        -   name: Plugin changed after its version was released?
            shell: bash
            run: |
                git fetch --tags --force --quiet
                version=$(jq -r .version plugin/wboost/.claude-plugin/plugin.json)
                tag="wboost-plugin-v${version}"
                if ! git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
                  echo "Skill ${version} is not released yet (no tag ${tag}) — nothing to guard."
                  exit 0
                fi
                if git diff --quiet "${tag}" HEAD -- plugin/wboost .claude-plugin; then
                  echo "plugin/wboost is identical to the released ${tag}."
                  exit 0
                fi
                echo "::error::The wboost plugin changed after ${version} was released (tag ${tag}), but its version did not. Users who have ${version} would never get this change. Bump the version (plugin.json, marketplace.json, SkillRelease::VERSION, SKILL.md metadata + skillVersion line, a new CHANGELOG entry), regenerate references/tools.json — see docs/mcp/skill-maintenance.md."
                git diff --stat "${tag}" HEAD -- plugin/wboost .claude-plugin
                exit 1


  phpstan:
      runs-on: ubuntu-latest
      container: ghcr.io/thedevs-cz/php:8.5-wboost
      steps:
        -   uses: actions/checkout@v6

        -   uses: actions/cache@v5
            with:
                path: vendor
                key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
                restore-keys: |
                    ${{ runner.os }}-composer-

        -   uses: actions/cache@v5
            with:
                path: /tmp/phpstan
                key: ${{ runner.os }}-phpstan-${{ github.sha }}
                restore-keys: |
                    ${{ runner.os }}-phpstan-

        -   run: composer install --no-scripts --no-progress
        -   run: bin/console cache:warmup --env=dev
        -   run: composer run-script phpstan


  migrations-up-to-date:
      runs-on: ubuntu-latest
      container: ghcr.io/thedevs-cz/php:8.5-wboost
      services:
          postgres:
              image: postgres:16
              env:
                  POSTGRES_PASSWORD: postgres
                  POSTGRES_DB: wboost_test
              options: --health-cmd pg_isready --health-interval 3s --health-timeout 3s --health-retries 5
              ports:
                  - 5432:5432

      steps:
          -   uses: actions/checkout@v6
          -   uses: actions/cache@v5
              with:
                  path: vendor
                  key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-composer-

          -   run: composer install --no-scripts --no-progress

          -   run: bin/console doctrine:migrations:migrate --no-interaction --allow-no-migration
          -   run: bin/console doctrine:schema:update --dump-sql
          -   run: bin/console doctrine:schema:validate
