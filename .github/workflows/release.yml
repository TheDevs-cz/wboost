# Release — build the image once and deploy to lily via the shared reusable
# workflow (TheDevs-cz/ci). No more SSH-to-spare: this calls `_ship.yml`, which
# builds+pushes ghcr.io/thedevs-cz/wboost and then HMAC-POSTs
# https://deploy.lily.srv.thedevs.cz/hooks/wboost (per-app secret).
#
# The .env (DATABASE_URL, MinIO/S3, OAuth2 keys, Sentry, …) is rendered on the
# box (lily.srv) from wboost's Infisical project at deploy time — never here.
#
# Trigger: only after the `Tests` workflow succeeds on main (keeps the
# tests-must-pass gate the old SSH pipeline had).
#
# Secret (set on this repo): DEPLOY_WEBHOOK_SECRET (the per-app HMAC key). Passed
# EXPLICITLY because the reusable workflow lives under a different owner
# (secrets: inherit can't cross owners).

name: Release

on:
    workflow_run:
        workflows: [Tests]
        types:
            - completed
        branches:
            - main

permissions:
    contents: read
    packages: write
    actions: read     # the preflight looks up the last run that actually shipped

jobs:
    # A landing-only change must not rebuild and roll the PHP app (D61). This
    # preflight FAILS OPEN: on any doubt about what changed, ship. Never skip a
    # real deploy to save a build.
    #
    # It diffs against the head of the last Release run whose ship-production
    # job SUCCEEDED, not HEAD~1: a push of several commits ending with a docs-only
    # commit used to look "docs only" and silently skipped the code commits
    # before it (2026-11-05: two pushes never deployed).
    changed:
        runs-on: ubuntu-latest
        if: ${{ github.event.workflow_run.conclusion == 'success' }}
        outputs:
            app: ${{ steps.f.outputs.app }}
        steps:
            - uses: actions/checkout@v6
              with:
                  fetch-depth: 0
                  ref: ${{ github.event.workflow_run.head_sha }}
            - id: f
              shell: bash
              env:
                  GH_TOKEN: ${{ github.token }}
                  REPO: ${{ github.repository }}
              run: |
                  ship() { echo "app=true" >> "$GITHUB_OUTPUT"; echo "ship: $1"; exit 0; }
                  base=""
                  for id in $(gh api "repos/$REPO/actions/workflows/release.yml/runs?branch=main&status=success&per_page=30" --jq '.workflow_runs[].id' 2>/dev/null); do
                    c=$(gh api "repos/$REPO/actions/runs/$id/jobs" --jq '[.jobs[] | select(.name | startswith("ship-production")) | .conclusion] | if length > 0 and all(. == "success") then "success" else "no" end' 2>/dev/null || echo no)
                    if [ "$c" = "success" ]; then base=$(gh api "repos/$REPO/actions/runs/$id" --jq .head_sha 2>/dev/null); break; fi
                  done
                  [ -n "$base" ] || ship "no previously shipped run found"
                  git merge-base --is-ancestor "$base" HEAD 2>/dev/null || ship "last shipped $base is not an ancestor"
                  files=$(git diff --name-only "$base" HEAD 2>/dev/null) || ship "diff failed"
                  [ -n "$files" ] || ship "empty diff"
                  echo "changed since last ship ($base):"; echo "$files"
                  if echo "$files" | grep -qvE '^(landing|designs|docs)/'; then
                    ship "app files changed"
                  fi
                  echo "app=false" >> "$GITHUB_OUTPUT"

    ship-production:
        needs: changed
        if: ${{ needs.changed.outputs.app == 'true' }}
        uses: TheDevs-cz/ci/.github/workflows/_ship.yml@v1
        secrets:
            DEPLOY_WEBHOOK_SECRET: ${{ secrets.DEPLOY_WEBHOOK_SECRET }}
        with:
            app: wboost
            image: ghcr.io/thedevs-cz/wboost
            deploy_host: lily.srv.thedevs.cz
            build_args: APP_VERSION=${{ github.event.workflow_run.head_sha }}
            await_deploy: false
