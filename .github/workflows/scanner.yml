name: Scanner

# The AI scan scanner (scanner/) is a separate service with its own image; its tests do not need
# the app. The definition it runs on lives in resources/ai-scan/definition and is covered here too.
on:
    push:
        paths:
            - 'scanner/**'
            - 'resources/ai-scan/**'
            - '.github/workflows/scanner.yml'
    pull_request:
        paths:
            - 'scanner/**'
            - 'resources/ai-scan/**'

jobs:
    test:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        defaults:
            run:
                working-directory: scanner
        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: npm
                  cache-dependency-path: scanner/package-lock.json
            - uses: actions/setup-python@v6
              with:
                  python-version: '3.12'
                  cache: pip
                  cache-dependency-path: scanner/requirements.txt
            - run: npm ci
            - run: python -m venv .venv && .venv/bin/pip install -r requirements.txt
            - run: npm test
