server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # Emit RELATIVE Location headers. nginx builds an absolute redirect from the
    # scheme it sees, and behind Traefik that is plain http — so the trailing
    # slash 301 below pointed at http://wboost.cz/… and cost an extra hop
    # through the entrypoint redirect (measured live, 2026-09-03). Relative
    # keeps the browser's own scheme and host.
    absolute_redirect off;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/html text/css application/javascript image/svg+xml application/xml;
    # woff2 is already compressed — deliberately not in gzip_types.

    # Canonicalise a trailing slash away before anything else. Traefik routes both
    # forms (the page regex ends `/?$`) so this 301 is reachable; without it the
    # slashed variant would be a duplicate URL. `landing/` is excluded — it is an
    # asset prefix, not a page.
    location ~ "^/(?!landing/)([a-z0-9-]+)/$" { return 301 /$1; }

    # Retired page: keep the old URL's links and ranking.
    location = /klienti { return 301 /; }

    # `/` MUST be its own exact-match block. In the general block below try_files
    # would test "/" as a file, fail, test "/.html", fail, and 404 the homepage —
    # the `index` directive never gets a look in. This is a real bug, not a nicety.
    location = / {
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }

    # Extensionless page URLs: /ochrana-osobnich-udaju -> ochrana-osobnich-udaju.html.
    # The rewrite is internal, so /index.html is never emitted as a URL.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri.html =404;
    }

    # The image build stamps every asset URL with its content hash (stamp-assets.sh),
    # so a `?v=` request can never go stale and is cached for a year. Anything
    # unstamped (dev bind mount, an old link) keeps the short lifetime.
    location /landing/ { add_header Cache-Control $landing_asset_cache; }
}

map $arg_v $landing_asset_cache {
    ""      "public, max-age=600";
    default "public, max-age=31536000, immutable";
}
