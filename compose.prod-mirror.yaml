# Throwaway local stack running the DEV code against a 1:1 snapshot of
# production data, on shifted ports so it can run alongside the normal dev
# stack. Run with an explicit project name so volumes never clobber dev data:
#
#   docker compose -p wboost-prod -f compose.prod-mirror.yaml up -d
#
# Refresh from prod (lily):
#   ssh root@lily.srv.thedevs.cz 'cd /srv/wboost && docker compose exec -T db pg_dump -U wboost -d wboost --no-owner --no-acl -Fc' > .docker-data/prod-mirror/wboost.dump
#   ssh root@lily.srv.thedevs.cz 'tar -C /srv/wboost/storage -czf - .' | tar -C .docker-data/minio-prod-data -xzf -
#   docker compose -p wboost-prod -f compose.prod-mirror.yaml up -d postgres
#   docker compose -p wboost-prod -f compose.prod-mirror.yaml exec -T postgres pg_restore -U postgres -d wboost --no-owner --no-acl < .docker-data/prod-mirror/wboost.dump
#   docker compose -p wboost-prod -f compose.prod-mirror.yaml up -d   # web start runs migrations against the restored data
#
# Ports: web 8090, adminer 8001, mailpit 8027/1026, minio 19010/19011, pg 5434.
volumes:
    postgres-data:
    redis-data:
    mailpit-data:
    caddy_data:
    caddy_config:

services:
    web:
        image: ghcr.io/thedevs-cz/php:8.5-wboost
        restart: unless-stopped
        tty: true
        volumes:
            - .:/app
            - ./.docker/on-startup.sh:/docker-entrypoint.d/on-startup.sh
            - caddy_data:/data
            - caddy_config:/config
        depends_on:
            - postgres
            - redis
            - minio
        ports:
            - "8090:80"
        environment:
            UPLOADS_BASE_URL: "http://localhost:19010"
            # COMPOSER_AUTH with a GitHub token lives in your local
            # compose.override.yaml (gitignored) — export it here manually if
            # the mirror's composer install needs private packages.

    postgres:
        image: postgres:16.1
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
            POSTGRES_DB: wboost
        volumes:
            - postgres-data:/var/lib/postgresql/data
        ports:
            - "5434:5432"

    redis:
        image: redis:7.2
        restart: unless-stopped
        volumes:
            - redis-data:/data

    adminer:
        image: adminer:5.3.0
        ports:
            - "8001:8080"
        environment:
            ADMINER_DEFAULT_SERVER: postgres
        depends_on:
            - postgres

    mailer:
        image: axllent/mailpit
        ports:
            - "1026:1025"
            - "8027:8025"
        environment:
            MP_SMTP_AUTH_ACCEPT_ANY: 1
            MP_SMTP_AUTH_ALLOW_INSECURE: 1
            MP_DATABASE: "/data/mailpit.db"
        volumes:
            - mailpit-data:/data

    minio:
        restart: unless-stopped
        image: minio/minio:latest
        environment:
            MINIO_DOMAIN: "localhost:19010"
            MINIO_SERVER_URL: "http://minio:9000"
            MINIO_BROWSER_REDIRECT_URL: "http://localhost:19011"
            MINIO_ROOT_USER: "wboost"
            MINIO_ROOT_PASSWORD: "wboostminio"
        command: ["server", "/data", "--console-address", ":9001"]
        ports:
            - "19010:9000"
            - "19011:9001"
        volumes:
            - .docker-data/minio-prod-data:/data
        healthcheck:
            test: "mc ready local"
            start_period: 5s
            timeout: 5s
            interval: 10s
            retries: 2

    gotenberg:
        image: gotenberg/gotenberg:8

    minio_setup:
        image: minio/mc:latest
        restart: no
        depends_on:
            minio:
                condition: service_healthy
        volumes:
            - .docker/setup-minio.sh:/setup-minio.sh
        environment:
            MINIO_SERVER_URL: "http://minio:9000"
            MINIO_ACCESS_KEY: "wboost"
            MINIO_SECRET_KEY: "wboostminio"
            BUCKET_NAME: "wboost"
        entrypoint: ["sh", "/setup-minio.sh"]
